name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore StaticArtifactLab.slnx
      - run: dotnet build StaticArtifactLab.slnx -c Release --no-restore
      - run: dotnet test StaticArtifactLab.Tests/StaticArtifactLab.Tests.csproj -c Release --no-build
      - run: dotnet format StaticArtifactLab.slnx --verify-no-changes --no-restore
